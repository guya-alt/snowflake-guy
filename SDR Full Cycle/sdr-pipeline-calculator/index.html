<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline Calculator</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        }
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#FBFBFB] text-zinc-900 font-sans selection:bg-zinc-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const ICONS = {
      Calculator: '<rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="14"/><line x1="16" x2="16" y1="10" y2="10"/><line x1="16" x2="16" y1="18" y2="18"/><line x1="8" x2="8" y1="14" y2="14"/><line x1="8" x2="8" y1="10" y2="10"/><line x1="8" x2="8" y1="18" y2="18"/><line x1="12" x2="12" y1="14" y2="14"/><line x1="12" x2="12" y1="10" y2="10"/><line x1="12" x2="12" y1="18" y2="18"/>',
      TrendingUp: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
      TrendingDown: '<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>',
      Users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
      Target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
      ArrowUpRight: '<line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/>',
      Briefcase: '<rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
      Layers: '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/>',
      Percent: '<line x1="19" x2="5" y1="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
      History: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
      Info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
      CheckCircle: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
      Settings2: '<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="7" r="3"/><circle cx="7" cy="17" r="3"/>'
    };

    const Icon = ({ name, className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{ __html: ICONS[name] }} />
    );

    function App() {
      // Reverted to default values
      const [sdrCount, setSdrCount] = useState(5);
      const [targetRevenue, setTargetRevenue] = useState(150000);
      const [multiplier, setMultiplier] = useState(3);
      const [asp, setAsp] = useState(34000);
      const [qualRate, setQualRate] = useState(24);
      const [lastYearTotalMeetings, setLastYearTotalMeetings] = useState(248);

      const [enableChurn, setEnableChurn] = useState(false);
      const [churnRate, setChurnRate] = useState(39);

      const distributionCurve = [0.14, 0.13, 0.13, 0.10, 0.10, 0.08, 0.08, 0.08, 0.08, 0.08];
      const cumulativePct = Array.from({length: sdrCount || 0}, (_, i) => i < 10 ? distributionCurve[i] : 0.08).reduce((a, b) => a + b, 0);
      const selectedBaseline = Math.round((lastYearTotalMeetings || 0) * cumulativePct);

      const formatCurrency = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val);
      const formatNum = (val) => new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 }).format(val);

      const effectiveChurn = enableChurn ? (churnRate / 100) : 0;
      const grossTargetRevenue = effectiveChurn < 1 ? (targetRevenue / (1 - effectiveChurn)) : targetRevenue;

      const dealsWon = asp > 0 ? grossTargetRevenue / asp : 0;
      const pipelineDeals = dealsWon * multiplier;
      const pipelineRevenue = grossTargetRevenue * multiplier;
      
      // Calculate meetings/SDR forward from pipelineDeals without premature rounding
      const meetingsPerSdr = qualRate > 0 ? pipelineDeals / (qualRate / 100) : 0;
      const totalTeamMeetingsExact = meetingsPerSdr * (sdrCount || 0);
      
      // Ceiling applied strictly to the final team target
      const totalMeetings = Math.ceil(totalTeamMeetingsExact);
      
      const increaseNeeded = totalMeetings - selectedBaseline;
      const pctIncrease = selectedBaseline > 0 ? ((totalMeetings / selectedBaseline) - 1) * 100 : 0;
      const isPositiveGap = increaseNeeded > 0;

      return (
        <div className="p-4 md:p-8 lg:p-12">
          <div className="max-w-6xl mx-auto space-y-8">
            
            <header className="pb-6 border-b border-zinc-200">
              <div className="flex items-center gap-3">
                <div className="p-2 bg-white border border-zinc-200 rounded-md shadow-sm">
                  <Icon name="Calculator" className="w-5 h-5 text-zinc-800" />
                </div>
                <h1 className="text-2xl font-semibold tracking-tight text-zinc-900">Pipeline Calculator</h1>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12">
              
              {/* Inputs */}
              <section className="lg:col-span-4 space-y-6">
                <div className="flex items-center justify-between pb-2 border-b border-zinc-100">
                  <h2 className="text-sm font-medium text-zinc-800">Variables</h2>
                </div>
                
                <div className="space-y-5">
                  <InputRow icon="Users" label="Number of SDRs" value={sdrCount} setter={setSdrCount} step="1" />
                  <InputRow icon="Target" label={enableChurn ? "Net Target / SDR ($)" : "Target Revenue / SDR ($)"} value={targetRevenue} setter={setTargetRevenue} step="1000" />
                  <InputRow icon="Layers" label="Pipeline Multiplier (x)" value={multiplier} setter={setMultiplier} step="0.5" />
                  <InputRow icon="Briefcase" label="ASP ($)" value={asp} setter={setAsp} step="100" />
                  <InputRow icon="Percent" label="Qualification Rate (%)" value={qualRate} setter={setQualRate} step="0.1" />
                  
                  <div>
                    <InputRow 
                      icon="History" 
                      label="Last Year's Total Team Meetings" 
                      value={lastYearTotalMeetings} 
                      setter={setLastYearTotalMeetings} 
                      step="10" 
                      tooltip="Filters: 1-100 eng, past 365d, known owner.

Enter full team's meetings last year. Calculates baseline for your top SDRs automatically."
                    />
                    <div className="mt-2 text-xs font-medium bg-zinc-100/50 text-zinc-500 px-3 py-2 rounded-md border border-zinc-100">
                      Top {sdrCount || 0} SDR Baseline: <strong className="text-zinc-800">{formatNum(selectedBaseline)} meetings</strong> <span className="opacity-75">({(cumulativePct * 100).toFixed(0)}% of total)</span>
                    </div>
                  </div>

                  <div className="pt-4 mt-6 border-t border-zinc-200">
                    <div className="flex items-center justify-between mb-4">
                      <div className="flex items-center gap-2">
                        <Icon name="Settings2" className="w-4 h-4 text-zinc-500" />
                        <span className="text-sm font-medium text-zinc-800">Model Annual Churn</span>
                      </div>
                      
                      <button 
                        onClick={() => setEnableChurn(!enableChurn)}
                        className={`w-10 h-5 rounded-full relative transition-colors focus:outline-none ${enableChurn ? 'bg-zinc-900' : 'bg-zinc-200'}`}
                      >
                        <span className={`absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full transition-transform ${enableChurn ? 'translate-x-5' : ''}`}></span>
                      </button>
                    </div>

                    {enableChurn && (
                      <div className="animate-in fade-in slide-in-from-top-2 duration-200">
                        <InputRow 
                          icon="TrendingDown" 
                          label="Annual Churn Rate (%)" 
                          value={churnRate} 
                          setter={setChurnRate} 
                          step="1" 
                          tooltip="Percentage of ARR lost after 12 months. Increases gross revenue required."
                        />
                      </div>
                    )}
                  </div>

                </div>
              </section>

              {/* Outputs */}
              <section className="lg:col-span-8 flex flex-col space-y-8">
                
                {/* Hero Summary */}
                <div className="bg-zinc-900 text-white rounded-xl p-8 shadow-sm border border-zinc-800 relative overflow-hidden">
                  <div className="absolute top-0 right-0 p-8 opacity-10 pointer-events-none">
                    <Icon name="TrendingUp" className="w-48 h-48" />
                  </div>
                  <div className="relative z-10 space-y-6">
                    <div className="flex items-center justify-between">
                      <h3 className="text-zinc-400 text-sm font-medium">
                        SMB Target Summary
                      </h3>
                      <span className="text-xs px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-300 font-medium">
                        Top {sdrCount || 0} SDRs
                      </span>
                    </div>

                    {isPositiveGap ? (
                      <div>
                        <div className="flex items-end gap-4 mb-2">
                          <div className="text-5xl md:text-6xl font-semibold tracking-tight">
                            +{formatNum(increaseNeeded)}
                          </div>
                          <div className="flex items-center gap-1 text-lg mb-2 px-2.5 py-1 rounded-md font-medium bg-zinc-800 text-zinc-100">
                            <Icon name="ArrowUpRight" className="w-5 h-5 text-emerald-400" />
                            +{formatNum(pctIncrease)}%
                          </div>
                        </div>
                        <p className="text-zinc-400 text-sm max-w-lg leading-relaxed">
                          Top {sdrCount || 0} SDRs need <strong className="text-zinc-200">+{formatNum(increaseNeeded)} meetings</strong> (+{formatNum(pctIncrease)}%) over their baseline to hit goals.
                        </p>
                      </div>
                    ) : (
                      <div>
                        <div className="flex items-end gap-4 mb-2">
                          <div className="text-4xl md:text-5xl font-semibold tracking-tight text-emerald-400 flex items-center gap-3">
                            <Icon name="CheckCircle" className="w-10 h-10" /> 
                            Target Met
                          </div>
                        </div>
                        <p className="text-emerald-500/80 text-sm max-w-lg leading-relaxed">
                          Baseline of <strong className="text-emerald-400">{formatNum(selectedBaseline)}</strong> meetings covers the target of <strong className="text-emerald-400">{formatNum(totalMeetings)}</strong> meetings.
                        </p>
                      </div>
                    )}

                    {/* Summary Cards */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-4 border-t border-zinc-800/80 text-sm">
                      <div className="bg-zinc-800/50 p-3.5 rounded-lg border border-zinc-800">
                        <div className="text-zinc-400 text-xs mb-1">Target</div>
                        <div className="text-xl font-semibold text-white">{formatNum(totalMeetings)} <span className="text-xs font-normal text-zinc-400">meetings</span></div>
                      </div>
                      <div className="bg-zinc-800/50 p-3.5 rounded-lg border border-zinc-800">
                        <div className="text-zinc-400 text-xs mb-1">Baseline</div>
                        <div className="text-xl font-semibold text-white">{formatNum(selectedBaseline)} <span className="text-xs font-normal text-zinc-400">meetings</span></div>
                      </div>
                      <div className="bg-zinc-800/50 p-3.5 rounded-lg border border-zinc-800">
                        <div className="text-zinc-400 text-xs mb-1">Growth Needed</div>
                        <div className="text-xl font-semibold text-white">
                          {isPositiveGap ? `+${formatNum(increaseNeeded)}` : '0'} 
                          <span className={`text-xs font-normal ml-1.5 ${isPositiveGap ? 'text-emerald-400' : 'text-zinc-400'}`}>
                            ({isPositiveGap ? `+${formatNum(pctIncrease)}%` : '0%'})
                          </span>
                        </div>
                      </div>
                    </div>

                  </div>
                </div>

                <div className="bg-white border border-zinc-200 rounded-xl overflow-hidden shadow-sm">
                  <div className="px-6 py-4 border-b border-zinc-100 bg-zinc-50/50">
                    <h3 className="text-sm font-medium text-zinc-800">
                      Formula Breakdown
                    </h3>
                  </div>
                  <div className="p-6 text-sm text-zinc-600 font-mono space-y-4 overflow-x-auto">
                    
                    {enableChurn && (
                      <FormulaRow 
                        step="1" 
                        title="Gross Revenue Needed" 
                        formula="Net Target / (1 - Churn)" 
                        calc={`${formatCurrency(targetRevenue)} / ${(1 - effectiveChurn).toFixed(2)}`} 
                        result={formatCurrency(grossTargetRevenue)} 
                      />
                    )}
                    <FormulaRow 
                      step={enableChurn ? "2" : "1"} 
                      title="Deals Won Needed" 
                      formula={`${enableChurn ? 'Gross Revenue' : 'Target Revenue'} / ASP`} 
                      calc={`${formatCurrency(grossTargetRevenue)} / ${formatCurrency(asp)}`} 
                      result={formatNum(dealsWon)} 
                    />
                    <FormulaRow 
                      step={enableChurn ? "3" : "2"} 
                      title="Pipeline Deals" 
                      formula="Deals Won * Multiplier" 
                      calc={`${formatNum(dealsWon)} * ${multiplier}`} 
                      result={formatNum(pipelineDeals)} 
                    />
                    <FormulaRow 
                      step={enableChurn ? "4" : "3"} 
                      title="Pipeline Revenue" 
                      formula={`${enableChurn ? 'Gross Revenue' : 'Target Revenue'} * Multiplier`} 
                      calc={`${formatCurrency(grossTargetRevenue)} * ${multiplier}`} 
                      result={formatCurrency(pipelineRevenue)} 
                    />
                    <FormulaRow 
                      step={enableChurn ? "5" : "4"} 
                      title="Meetings / SDR" 
                      formula="Pipeline Deals / Qual Rate" 
                      calc={`${formatNum(pipelineDeals)} / ${qualRate}%`} 
                      result={formatNum(meetingsPerSdr)} 
                    />
                    <FormulaRow 
                      step={enableChurn ? "6" : "5"} 
                      title="Total Meetings" 
                      formula="Math.ceil(Meetings per SDR * SDRs)" 
                      calc={`${formatNum(meetingsPerSdr)} * ${sdrCount || 0}`} 
                      result={formatNum(totalMeetings)} 
                    />
                    <div className="pt-3 border-t border-zinc-100">
                      <FormulaRow 
                        step={enableChurn ? "7" : "6"} 
                        title="Meeting Growth" 
                        formula="Total Meetings - Baseline" 
                        calc={`${formatNum(totalMeetings)} - ${formatNum(selectedBaseline)}`} 
                        result={isPositiveGap ? `+${formatNum(increaseNeeded)}` : 'Target Met'} 
                        highlight={isPositiveGap}
                        success={!isPositiveGap} 
                      />
                    </div>
                  </div>
                </div>

              </section>
            </div>
          </div>
        </div>
      );
    }

    function InputRow({ icon, label, value, setter, step, tooltip }) {
      return (
        <div className="mb-2">
          <label className="flex items-center gap-2 text-sm font-medium text-zinc-600 mb-1.5 relative group w-fit cursor-default">
            <span className="flex items-center gap-2">
              <span className="text-zinc-400"><Icon name={icon} className="w-4 h-4" /></span>
              {label}
            </span>
            {tooltip && (
              <div className="relative flex items-center">
                <Icon name="Info" className="w-4 h-4 text-zinc-400 hover:text-zinc-600 transition-colors" />
                <div className="absolute left-0 sm:left-1/2 sm:-translate-x-1/2 bottom-full mb-2 hidden group-hover:block w-64 p-2.5 bg-zinc-800 text-zinc-100 text-xs font-normal rounded-md shadow-lg z-50 text-left sm:text-center pointer-events-none whitespace-pre-line leading-relaxed">
                  {tooltip}
                  <div className="absolute left-2 sm:left-1/2 sm:-translate-x-1/2 top-full w-0 h-0 border-l-[5px] border-r-[5px] border-t-[5px] border-l-transparent border-r-transparent border-t-zinc-800"></div>
                </div>
              </div>
            )}
          </label>
          <input 
            type="number" 
            step={step}
            value={value} 
            onChange={(e) => setter(e.target.value === '' ? '' : Number(e.target.value))} 
            className="w-full px-3 py-2 bg-white border border-zinc-200 rounded-lg text-sm text-zinc-900 shadow-sm focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-all outline-none" 
          />
        </div>
      );
    }

    function FormulaRow({ step, title, formula, calc, result, highlight = false, success = false }) {
      return (
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 py-1">
          <div className="flex items-center gap-3 min-w-[200px]">
            <span className="text-zinc-400 select-none">{step}.</span>
            <span className="font-medium text-zinc-700">{title}</span>
          </div>
          <div className="hidden sm:block text-zinc-400 text-xs truncate flex-1 px-4">
            {formula}
          </div>
          <div className="flex items-center gap-3 text-right">
            <span className="text-zinc-400 text-xs hidden md:inline-block">{calc}</span>
            <span className="text-zinc-300 hidden md:inline-block">=</span>
            <span className={`font-semibold ${success ? 'text-emerald-500' : (highlight ? 'text-zinc-900' : 'text-zinc-700')}`}>{result}</span>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
